name: Build and deploy CorePoint

on:
  push:
    branches:
      - master

permissions:
  id-token: write   # krävs för OIDC-inloggning mot Azure
  contents: read

env:
  AZURE_WEBAPP_NAME: app-fp-wucbout2vvcwe
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Bygg React-frontend ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client (Vite)
        working-directory: client
        run: npm run build

      # ---------- Kopiera React-bygget till wwwroot ----------
      - name: Clear old wwwroot content
        run: |
          rm -rf server/wwwroot
          mkdir -p server/wwwroot

      - name: Copy Vite build into wwwroot
        run: cp -r client/dist/. server/wwwroot/

      # ---------- Bygg och publicera .NET-API ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: server
        run: dotnet restore

      - name: Build
        working-directory: server
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet tests server.Tests/CompanyPortal.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish (skapar även server/publish.zip via projektets ZipPublishOutput-target)
        working-directory: server
        run: dotnet publish --configuration Release --no-build --output ./publish

      # ---------- Logga in mot Azure (OIDC, nyckelfritt) ----------
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------- Deploy till App Service ----------
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: server/publish.zip
